[project]
name = "carbase-mcp"
version = "0.1.3"
description = "MCP server for the Autoweek Carbase: Dutch car makes, models, versions and full specifications"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "vollebergh" }]
dependencies = [
    "mcp>=1.20,<2",
    "httpx>=0.28,<1",
]

[project.scripts]
carbase-mcp = "carbase_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.14"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carbase_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits www.autoweek.nl (run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
