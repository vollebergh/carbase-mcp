[project]
name = "carbase-mcp"
version = "0.6.1"
description = "MCP server for the Autoweek Carbase: Dutch car makes, models, versions and full specifications"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT-0"
license-files = ["LICENSE"]
authors = [{ name = "vollebergh" }]
keywords = ["mcp", "model-context-protocol", "autoweek", "carbase", "cars", "netherlands"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.20,<2",
    "httpx>=0.28,<1",
]

[project.urls]
Repository = "https://github.com/vollebergh/carbase-mcp"
Changelog = "https://github.com/vollebergh/carbase-mcp/blob/main/CHANGELOG.md"

[project.scripts]
carbase-mcp = "carbase_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.14"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carbase_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits www.autoweek.nl (run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
