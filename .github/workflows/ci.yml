name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install (exact versions and hashes from uv.lock)
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Lint and security rules (ruff incl. S)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests (offline)
        run: uv run pytest
      - name: Known vulnerabilities in runtime dependencies
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt"
      - name: Secrets in git history
        if: matrix.python == '3.14'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
