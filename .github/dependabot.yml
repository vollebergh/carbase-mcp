version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases settle before proposing them
    groups:
      python:
        patterns: ["*"]
    ignore:
      # mcp 2.x renames FastMCP to MCPServer and changes other APIs: migrate deliberately (backlog B-23)
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
